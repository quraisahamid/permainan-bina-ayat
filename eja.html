<!DOCTYPE html>
<html lang="ms" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="google" content="notranslate">
  <meta name="chrome" content="notranslate">

  <title>FASA 2: Mengeja i-SKA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ec4899">

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=16').catch((err) => console.log('SW Error:', err));
      });
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial', sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #fdf2f8;
      background-image: radial-gradient(#fbcfe8 1.5px, transparent 1.5px), radial-gradient(#fbcfe8 1.5px, #fdf2f8 1.5px);
      background-size: 60px 60px;
      background-position: 0 0, 30px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: clamp(8px, 2vw, 20px);
    }

    #confetti-canvas {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    .external-menu-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: clamp(300px, 90vw, 700px);
      margin-bottom: 12px;
      gap: 10px;
    }

    .nav-mode-btn {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: bold;
      font-size: clamp(0.85rem, 2vw, 1.05rem);
      cursor: pointer;
      box-shadow: 0 4px 0 #1d4ed8;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .bgm-btn {
      background: #f59e0b;
      border: none;
      border-radius: 12px;
      padding: 8px 16px;
      font-size: clamp(0.85rem, 2vw, 1rem);
      font-weight: bold;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 0 #b45309;
    }

    .main-card {
      background: white;
      border: 4px solid #ec4899;
      border-radius: 24px;
      padding: clamp(14px, 3vw, 24px);
      width: clamp(300px, 90vw, 700px);
      text-align: center;
      box-shadow: 0 12px 28px rgba(0,0,0,0.1);
    }

    .title-banner {
      background-color: #ec4899;
      color: white;
      padding: 10px;
      border-radius: 14px;
      font-size: clamp(1.2rem, 3vw, 1.6rem);
      font-weight: bold;
      margin-bottom: 15px;
      box-shadow: 0 4px 0 #be185d;
      text-transform: uppercase;
    }

    .word-display-box {
      background: #fff1f2;
      border: 3px dashed #fda4af;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .target-word {
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: bold;
      letter-spacing: 2px;
      color: #be185d;
    }

    .syllable-container {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 5px;
    }

    .syllable-btn {
      background: #fce7f3;
      border: 3px solid #f472b6;
      color: #9d174d;
      padding: 10px 20px;
      border-radius: 14px;
      font-size: clamp(1.3rem, 4vw, 2rem);
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 0 #db2777;
      transition: transform 0.1s;
    }

    .syllable-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #db2777;
    }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 15px;
    }

    .action-btn {
      padding: 10px 18px;
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      font-weight: bold;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      color: white;
      box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    }

    .btn-prev { background-color: #64748b; }
    .btn-next { background-color: #10b981; }

    .action-btn:disabled {
      background-color: #cbd5e1 !important;
      cursor: not-allowed;
      box-shadow: none;
    }
  </style>
</head>
<body class="notranslate">

<canvas id="confetti-canvas"></canvas>
<audio id="bgm-player" loop autoplay src="bgm.mp3"></audio>

<div class="external-menu-bar">
  <a href="index.html" class="nav-mode-btn">🏠 Halaman Utama</a>
  <button class="bgm-btn" id="bgm-toggle" onclick="toggleBGM()">🔊 Muzik: ON</button>
</div>

<div class="main-card">
  <div class="title-banner">🔤 Fasa 2: Mengeja i-SKA</div>

  <div style="font-size: 1.1rem; font-weight: bold; color: #475569; margin-bottom: 10px;" id="progress-text">
    Perkataan 1 / 10
  </div>

  <div class="word-display-box">
    <div class="target-word" id="full-word-display">-</div>
    <div class="syllable-container" id="syllables-box"></div>
  </div>

  <div class="controls-bar">
    <button class="action-btn btn-prev" id="prev-btn" onclick="prevWord()">⬅️ Sebelum</button>
    <button class="action-btn btn-next" id="next-btn" onclick="nextWord()">Seterusnya ➡️</button>
  </div>
</div>

<script>
  /* Enjin Speech Synthesis Kalis Reset iOS/Android */
  let msVoice = null;
  let synthUnlocked = false;

  function loadVoices() {
    if ('speechSynthesis' in window) {
      const voices = window.speechSynthesis.getVoices();
      if (voices && voices.length > 0) {
        msVoice = voices.find(v => v.lang === 'ms-MY' || v.lang === 'ms_MY' || v.lang.toLowerCase().includes('melayu') || v.lang.toLowerCase().includes('id'));
      }
    }
  }

  function unlockSpeechSynthesis() {
    if (!synthUnlocked && 'speechSynthesis' in window) {
      window.speechSynthesis.resume();
      loadVoices();
      const dummy = new SpeechSynthesisUtterance(" ");
      dummy.volume = 0.01;
      window.speechSynthesis.speak(dummy);
      synthUnlocked = true;
    }
  }

  document.addEventListener('touchstart', unlockSpeechSynthesis, { passive: true });
  document.addEventListener('click', unlockSpeechSynthesis, { passive: true });

  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();
  }

  let isProcessing = false; // Kunci mengelakkan reset semasa menekan huruf

  function speakText(text, callback) {
    if ('speechSynthesis' in window) {
      try {
        window.speechSynthesis.cancel();
        window.speechSynthesis.resume();

        const utterance = new SpeechSynthesisUtterance(text.toLowerCase());
        utterance.lang = msVoice ? msVoice.lang : 'ms-MY';
        if (msVoice) utterance.voice = msVoice;
        utterance.rate = 0.8;

        let done = false;
        const finish = () => {
          if (!done) {
            done = true;
            isProcessing = false;
            if (callback) callback();
          }
        };

        utterance.onend = finish;
        utterance.onerror = finish;

        setTimeout(() => {
          window.speechSynthesis.speak(utterance);
        }, 50);

        // Safety timeout sekiranya iOS/Android tidak memicu onend
        setTimeout(finish, 2500);
      } catch (e) {
        isProcessing = false;
        if (callback) callback();
      }
    } else {
      isProcessing = false;
      if (callback) callback();
    }
  }

  /* Kawalan Audio BGM */
  const bgmAudio = document.getElementById("bgm-player");
  const bgmBtn = document.getElementById("bgm-toggle");

  function tryAutoplayBGM() {
    bgmAudio.volume = 0.12;
    bgmAudio.play().then(() => {
      bgmBtn.innerText = "🔊 Muzik: ON";
    }).catch(() => {
      const enableOnGesture = () => {
        bgmAudio.play().then(() => {
          bgmBtn.innerText = "🔊 Muzik: ON";
        });
        document.removeEventListener('click', enableOnGesture);
        document.removeEventListener('touchstart', enableOnGesture);
      };
      document.addEventListener('click', enableOnGesture);
      document.addEventListener('touchstart', enableOnGesture);
    });
  }

  function toggleBGM() {
    if (bgmAudio.paused) {
      bgmAudio.volume = 0.12;
      bgmAudio.play();
      bgmBtn.innerText = "🔊 Muzik: ON";
    } else {
      bgmAudio.pause();
      bgmBtn.innerText = "🔇 Muzik: OFF";
    }
  }

  window.addEventListener("DOMContentLoaded", tryAutoplayBGM);

  /* Data Perkataan Fasa 2 */
  const wordList = [
    { word: "cuci", syllables: ["cu", "ci"] },
    { word: "masak", syllables: ["ma", "sak"] },
    { word: "baca", syllables: ["ba", "ca"] },
    { word: "sapu", syllables: ["sa", "pu"] },
    { word: "minum", syllables: ["mi", "num"] },
    { word: "lipat", syllables: ["li", "pat"] },
    { word: "basuh", syllables: ["ba", "suh"] },
    { word: "potong", syllables: ["po", "tong"] },
    { word: "susun", syllables: ["su", "sun"] },
    { word: "tulis", syllables: ["tu", "lis"] }
  ];

  let currentIndex = 0;

  function loadWord() {
    isProcessing = false;
    const item = wordList[currentIndex];
    
    document.getElementById("progress-text").innerText = `Perkataan ${currentIndex + 1} / ${wordList.length}`;
    document.getElementById("full-word-display").innerText = item.word;
    document.getElementById("prev-btn").disabled = currentIndex === 0;
    document.getElementById("next-btn").disabled = currentIndex === wordList.length - 1;

    const box = document.getElementById("syllables-box");
    box.innerHTML = "";

    item.syllables.forEach((syl) => {
      const btn = document.createElement("button");
      btn.className = "syllable-btn";
      btn.innerText = syl;

      // Hentikan Touch Ghosting dan Double-Tap Reset
      btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        playSyllable(syl);
      }, { passive: false });

      btn.onclick = (e) => {
        if (e.pointerType !== 'touch') playSyllable(syl);
      };

      box.appendChild(btn);
    });
  }

  function playSyllable(syl) {
    if (isProcessing) return; // Sekat sentuhan serentak yang memicu reset
    isProcessing = true;

    if (!bgmAudio.paused) bgmAudio.volume = 0.03;

    speakText(syl, () => {
      if (!bgmAudio.paused) bgmAudio.volume = 0.12;
    });
  }

  function prevWord() {
    if (currentIndex > 0) {
      currentIndex--;
      loadWord();
    }
  }

  function nextWord() {
    if (currentIndex < wordList.length - 1) {
      currentIndex++;
      loadWord();
    }
  }

  loadWord();
</script>
</body>
</html>
