<!DOCTYPE html>
<html lang="ms" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="google" content="notranslate">
  <meta name="chrome" content="notranslate">

  <title>Menu Utama i-SKA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3b82f6">

  <!-- Skrip Pendaftaran Service Worker & Skrin Muat Turun Kemas Kini -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=23').then((registration) => {
          
          const showUpdateScreen = () => {
            const overlay = document.getElementById('update-overlay');
            if (overlay) overlay.style.display = 'flex';
          };

          if (registration.installing) {
            showUpdateScreen();
            registration.installing.onstatechange = (e) => {
              if (e.target.state === 'installed') {
                if (navigator.serviceWorker.controller) {
                  window.location.reload();
                }
              }
            };
          }

          if (registration.waiting) {
            showUpdateScreen();
            registration.waiting.postMessage({ action: 'skipWaiting' });
          }

          registration.addEventListener('updatefound', () => {
            showUpdateScreen();
            const newWorker = registration.installing;
            if (newWorker) {
              newWorker.onstatechange = () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  window.location.reload();
                }
              };
            }
          });

        }).catch((err) => console.log('SW Error:', err));
      });
    }

    navigator.serviceWorker?.addEventListener('message', (event) => {
      if (event.data && event.data.action === 'forceReload') {
        const overlay = document.getElementById('update-overlay');
        if (overlay) overlay.style.display = 'flex';
        setTimeout(() => {
          window.location.reload();
        }, 1000);
      }
    });
  </script>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial', sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f0f9ff;
      background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px), radial-gradient(#cbd5e1 1.5px, #f0f9ff 1.5px);
      background-size: 60px 60px;
      background-position: 0 0, 30px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: clamp(10px, 3vw, 20px);
    }

    .menu-card {
      background: white;
      border: 4px solid #3b82f6;
      border-radius: 24px;
      padding: clamp(20px, 4vw, 35px);
      width: clamp(300px, 90vw, 550px);
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.1);
    }

    h1 {
      color: #1e3a8a;
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      margin-top: 0;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .menu-btn-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .menu-btn {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 15px 20px;
      border-radius: 16px;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 0 #1d4ed8;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.1s;
    }

    .menu-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #1d4ed8;
    }

    .btn-fasa2 { background-color: #ec4899; box-shadow: 0 5px 0 #be185d; }
    .btn-fasa2:active { box-shadow: 0 1px 0 #be185d; }

    .btn-fasa3 { background-color: #10b981; box-shadow: 0 5px 0 #047857; }
    .btn-fasa3:active { box-shadow: 0 1px 0 #047857; }

    /* Gaya Skrin Amaran Kemas Kini (Update Overlay) */
    #update-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .update-box {
      background: white;
      color: #1e3a8a;
      padding: 30px;
      border-radius: 20px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 4px solid #3b82f6;
    }

    .spinner {
      border: 6px solid #f3f3f3;
      border-top: 6px solid #3b82f6;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="notranslate">

  <!-- Skrin Amaran Semasa PWA Kemas Kini Fail -->
  <div id="update-overlay">
    <div class="update-box">
      <div class="spinner"></div>
      <h2 style="margin-top: 0; color: #1e3a8a;">Sila tunggu sebentar...</h2>
      <p style="font-size: 1rem; color: #475569; font-weight: bold;">
        Aplikasi sedang memuat turun fail pembelajaran terkini. Jangan tutup atau sentuh skrin.
      </p>
    </div>
  </div>

  <audio id="bgm-player" loop autoplay src="bgm.mp3"></audio>

  <div class="menu-card">
    <h1>MENU UTAMA i-SKA</h1>
    <div class="menu-btn-container">
      <a href="eja.html" class="menu-btn btn-fasa2">🗣️ FASA 2: Mengeja Suku Kata</a>
      <a href="bina_ayat.html" class="menu-btn btn-fasa3">✍️ FASA 3: Membina Ayat</a>
    </div>
  </div>

  <script>
    const bgmPlayer = document.getElementById("bgm-player");
    window.addEventListener("load", () => {
      bgmPlayer.volume = 0.12;
      bgmPlayer.play().catch(() => {
        const unlockAudio = () => {
          bgmPlayer.play();
          document.removeEventListener('click', unlockAudio);
          document.removeEventListener('touchstart', unlockAudio);
        };
        document.addEventListener('click', unlockAudio);
        document.addEventListener('touchstart', unlockAudio);
      });
    });
  </script>
</body>
</html>
